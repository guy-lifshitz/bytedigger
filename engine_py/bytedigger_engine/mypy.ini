[mypy]
ignore_missing_imports = True
explicit_package_bases = True
exclude = (?x)(
    ^scripts/red_lint/fixtures/
    | /tests/
    | ^tests/
  )

# Lenient mode (no --strict). Catches arg-type, index, operator, var-annotated,
# misc, func-returns-value. This config stays lenient for the whole package;
# canary Group G enforces it at baseline 0.
#
# STRICT-RAMP (GH292): modules already strict-clean are promoted per-module via
# the list file `mypy-strict-modules.txt`, enforced by canary Group G-strict as
# `mypy --config-file mypy.ini --strict --follow-imports=silent @<list>`. Do NOT
# add per-module `[mypy-<mod>] strict=True` sections here — mypy 2.2.0 leaks the
# global-only strict sub-flags across the entire run (866 errors from one
# section). The list file + scoped CLI form is the leak-free equivalent.

[mypy-scripts.red_lint.fixtures.*]
ignore_errors = True
