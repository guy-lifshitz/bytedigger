# OSS packaging. Published on PyPI as bytedigger-engine, and since 0.2.0 the
# distribution owns exactly ONE top-level name: the `bytedigger_engine` package.
# Nothing is enumerated module-by-module any more, so `core_manifest.json` no
# longer has a `py-modules` list to mirror — it stays the engine's own
# core-module registry, addressed in package-relative paths.
# Host modules (hal_config_provider, model_flip_lint) are deliberately NOT packaged.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bytedigger-engine"
version = "0.2.0"
description = "Verified agentic TDD engine: a frozen, event-sourced RED->validate->GREEN state machine with deterministic anti-reward-hacking gates."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Guy Lifshitz" }]
requires-python = ">=3.9"
keywords = ["tdd", "agents", "llm", "code-generation", "verification", "reward-hacking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
# typing_extensions: hard import in lib/plugins/checklist_convergence (TypedDict
# backports for py<3.12). Pure-python, no transitive deps.
dependencies = ["typing_extensions>=4"]

[project.optional-dependencies]
dbos = ["dbos==2.27.0"]
# pyyaml: lazy runtime import in ac_dsl.py (yaml AC-block parsing); 8 AC-DSL
# tests fail without it (GH877)
test = ["pytest>=8", "pytest-timeout>=2.4.0", "pyyaml>=6"]
agentic-pydantic = ["pydantic-ai>=2.0,<3"]
# security gate: semgrep drives the RED-lint and security-lint steps. The gate
# fails closed with E_*_SEMGREP_MISSING when the binary is absent -- install
# this extra (or semgrep some other way) to arm it.
security = ["semgrep>=1.60"]

[project.scripts]
bytedigger-engine = "bytedigger_engine.run:main"

[tool.setuptools.packages.find]
# ONE distribution-owned top-level name. Before 0.2.0 this block published
# `lib*`, `workflows*`, `security*`, `scripts*`, `conformance*` as five
# top-level packages alongside 51 flat `py-modules`; all of it now lives under
# `bytedigger_engine`, so nothing but that name may be found. Host modules
# (hal_config_provider, model_flip_lint) remain deliberately unpackaged.
include = ["bytedigger_engine*"]

[tool.setuptools.package-data]
"bytedigger_engine.lib.plugins.anti_hallucination" = ["*.yaml", "*.md"]
"bytedigger_engine.security" = ["*.yml", "*.md", "*.toml", "*.txt"]
"bytedigger_engine.scripts.red_lint" = ["*.yml"]
