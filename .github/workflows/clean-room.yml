name: clean-room

# bd#100 — run the project the way an outsider would.
#
# `ci.yml` checks the repo out and runs it IN PLACE on a preconfigured runner.
# That is how bd#97 survived: the suite could not be collected from a clean
# clone while every check we ran stayed green. This workflow removes both
# assumptions — the tree comes from `git archive` (committed files only, no
# untracked local state) and it runs inside a stock image, not on the runner.
#
# Three jobs, all blocking, none allowed to fail. See docs/clean-room.md
# §Decision for why the split exists and what closes each part of it.
#
# Runner: [self-hosted, bytedigger], used ONLY as a docker host. The repo is
# private, so GitHub-hosted minutes are billed and every existing job is
# self-hosted; the host-coupling this workflow exists to catch is removed by
# the container, not by the runner. Nothing is mounted from the host, no docker
# socket is exposed to the container, and the container gets no host paths —
# see scripts/clean-room/run.sh. Fork pull requests must stay gated behind
# GitHub's "require approval for all outside collaborators" setting: this
# workflow gives PR code access to the runner's docker daemon.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Deliberately not the `ci-` group: this workflow must not cancel ci.yml.
  group: clean-room-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # An outsider's real path: bare stock image, zero host tools, README verbatim.
  quickstart:
    runs-on: [self-hosted, bytedigger]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        # On pull_request this is the merge commit, which is the right tree to
        # ship into the clean room: the state as it would land on main.

      - name: README quickstart, keyless demo, doctor, suite collection
        run: bash scripts/clean-room/run.sh quickstart 3.11

  # The suite itself, plus the exact host dependencies it silently requires.
  suite:
    runs-on: [self-hosted, bytedigger, heavy]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: full test suite with bd#102's closure set declared
        run: bash scripts/clean-room/run.sh suite 3.11

  # Known-broken things, watched so their fixes cannot go unnoticed. Each step
  # asserts the defect is STILL THERE and goes red the day it stops being — at
  # which point the workaround it justifies gets deleted. This is what makes
  # "delete the block when bd#102 lands" an enforced exit criterion instead of
  # a comment.
  debt-watch:
    runs-on: [self-hosted, bytedigger, heavy]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: bd#102 still open — suite must fail on a bare image
        run: bash scripts/clean-room/run.sh expect-fail:bd102 3.11

      - name: oldest declared Python (3.9) still broken — must fail to collect
        run: bash scripts/clean-room/run.sh expect-fail:py39 3.9
