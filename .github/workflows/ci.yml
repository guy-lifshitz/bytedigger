name: ci

# Self-contained OSS CI: packaging + import health + test suite for the
# engine core on stock GitHub infra. Installs WITHOUT the [dbos] extra to
# prove the core is dependency-free.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# main is isolated per commit rather than serialised (bd#12): with
# cancel-in-progress false on main, one permanently unschedulable run holding
# a per-ref group head-of-line blocks every later commit, forever and
# silently. Keyed by sha, a wedged run can block only its own commit.
# PR/branch behaviour is unchanged.
concurrency:
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: engine_py
    steps:
      - uses: actions/checkout@v4

      - name: "python venv (stock runner python3 - no setup-python)"
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-venv"
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"

      - name: pip install -e (packaging gate) — no dbos, no extras beyond test
        run: pip install --quiet -e ".[test]"

      - name: compileall — every shipped module byte-compiles
        run: python -m compileall -q .

      - name: import smoke — every packaged core module importable without dbos
        run: |
          python - <<'PY'
          # bd#44: the distribution owns ONE top-level name, so the module list
          # is discovered from the package rather than read off a `py-modules`
          # registry that no longer exists.
          import importlib, pathlib, sys
          pkg = pathlib.Path("bytedigger_engine")
          mods = ["bytedigger_engine"] + sorted(
              f"bytedigger_engine.{f.stem}" for f in pkg.glob("*.py")
              if f.stem != "__init__"
          )
          failed = []
          for m in mods:
              try:
                  importlib.import_module(m)
              except Exception as e:
                  failed.append(f"{m}: {type(e).__name__}: {e}")
          if failed:
              print("\n".join(failed)); sys.exit(1)
          print(f"OK: {len(mods)} package modules import clean without dbos")
          PY

      - name: manifest parity — every core_manifest module ships in the package
        run: |
          python - <<'PY'
          # bd#44: core_manifest.json paths are relative to the PACKAGE root
          # (`engine_py/bytedigger_engine/`), which is also where every packaged
          # file now lives — so parity is checked against the tree that ships,
          # not against a flat `py-modules` list.
          import json, pathlib, sys
          pkg = pathlib.Path("bytedigger_engine")
          man = json.load(open("core_manifest.json"))["core_modules"]
          missing = sorted(m for m in man if not (pkg / m).is_file())
          if missing:
              print("manifest-not-packaged:", missing); sys.exit(1)
          shipped = {str(f.relative_to(pkg)) for f in pkg.rglob("*.py")}
          extra = sorted(shipped - set(man))
          print(f"OK: {len(man)} manifest modules ship; non-core extras: {len(extra)}")
          PY

      - name: CLI smoke
        run: |
          python -m bytedigger_engine.run --help >/dev/null && echo "OK: bytedigger_engine.run --help"

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine_py
    steps:
      - uses: actions/checkout@v4

      - name: "python venv (stock runner python3 - no setup-python)"
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-venv"
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"

      - name: build wheel
        run: |
          pip install --quiet build
          python -m build --wheel
          rm -rf build  # setuptools build/ shadow tree breaks tree-grep tests

      - name: install wheel — no dbos
        run: |
          pip install --quiet dist/*.whl pytest pytest-timeout pyyaml  # pyyaml: lazy import in ac_dsl.py
          python -c "import bytedigger_engine; from bytedigger_engine import engine, event_log, workflows; print('OK: wheel imports')"

      - name: pytest — engine test suite (hermetic, no dbos, no network)
        run: python -m pytest tests/ -q -p no:cacheprovider --timeout=120

  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: "python venv (stock runner python3 - no setup-python)"
        run: |
          python3 -m venv "$RUNNER_TEMP/mf-venv"
          echo "$RUNNER_TEMP/mf-venv/bin" >> "$GITHUB_PATH"

      - name: pip install test deps
        run: pip install --quiet pytest pyyaml

      - name: version parity — all five declarations match the canonical source
        run: python3 scripts/version_parity.py --check

      - name: version parity unit tests
        run: python -m pytest tests/test_version_parity.py -q

      - name: version parity pointer-pin unit tests (bd#11)
        run: python -m pytest tests/test_version_parity_pin.py -q

      - name: ci main-heartbeat unit tests (bd#12 re-wedge fence)
        run: python -m pytest tests/test_ci_main_heartbeat.py -q

      - name: npm install-hint property tests (bd#17)
        run: python -m pytest tests/test_npm_install_hint.py -q

      - name: install-forms registry tests (bd#21)
        run: python -m pytest tests/test_install_forms_registry.py -q
